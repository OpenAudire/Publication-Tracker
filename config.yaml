external:
  # Optional Scopus / Web of Science exports (CSV). Only the DOI and an "indexed
  # in" flag are used; titles, citations and abstracts always come from OpenAlex,
  # so licensed metadata is never republished.
  - name: scopus
    path: data/external/scopus.csv
    doi_column: DOI
    affiliation_column: Affiliations
  - name: wos
    path: data/external/wos.csv
    doi_column: DOI
    affiliation_column: Addresses

