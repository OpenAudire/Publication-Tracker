<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Publication Tracker</title>
<style>
:root{
  color-scheme:light;
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10); --hover:rgba(11,11,11,.05);
  --s1:#2a78d6; --s2:#eb6834; --gray:#898781; --good:#006300;
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --hover:rgba(255,255,255,.06);
    --s1:#3987e5; --s2:#d95926; --good:#0ca30c;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --hover:rgba(255,255,255,.06);
  --s1:#3987e5; --s2:#d95926; --good:#0ca30c;
}
*{box-sizing:border-box}
html{background:var(--page)}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.page{max-width:1120px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
h1{font-size:22px;margin:0;font-weight:650}
.sub{color:var(--ink2);margin-top:2px}
.banner{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--s2);border-radius:8px;padding:8px 12px;margin-bottom:12px;color:var(--ink2)}
.btn,select,input[type=search]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 10px}
.btn{cursor:pointer}
.btn:hover,select:hover{background:var(--hover)}
.btn:focus-visible,select:focus-visible,input:focus-visible,[role=tab]:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
.filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:14px;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:12px}
.filters label{display:flex;align-items:center;gap:6px;color:var(--ink2)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{font:inherit;color:var(--ink2);background:transparent;border:0;padding:6px 12px;cursor:pointer}
.seg button[aria-selected=true]{background:var(--s1);color:#fff}
.seg button:not([aria-selected=true]):hover{background:var(--hover)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.tile .v{font-size:26px;font-weight:650;line-height:1.15}
.tile.hero{grid-column:span 2}
.tile.hero .v{font-size:48px}
.tile .l{color:var(--ink2);margin-top:2px}
.tile .n{color:var(--muted);font-size:12px;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;min-width:0}
.card.wide{grid-column:1/-1}
.card h2{font-size:15px;margin:0;font-weight:650}
.card .desc{color:var(--ink2);font-size:12.5px;margin:2px 0 8px}
.chead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.tbl-toggle{font-size:12px;padding:3px 8px;color:var(--ink2)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 0 2px;color:var(--ink2);font-size:12.5px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg .grid{stroke:var(--grid);stroke-width:1}
svg .axis{stroke:var(--axis);stroke-width:1}
svg .tick{fill:var(--muted);font-size:11px}
svg .dlabel{fill:var(--ink2);font-size:11.5px}
svg .hit{fill:transparent}
svg .hit:hover{fill:var(--hover)}
svg .xh{stroke:var(--axis);stroke-width:1}
.rank{display:flex;flex-direction:column;gap:5px}
.rrow{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center;padding:2px 4px;border-radius:6px}
.rrow:hover{background:var(--hover)}
.rrow .lab{color:var(--ink2);line-height:1.25}
.rrow .track{height:10px}
.rrow .bar{height:10px;background:var(--s1);border-radius:0 4px 4px 0;min-width:2px}
.rrow .val{color:var(--ink);font-variant-numeric:tabular-nums;min-width:2.5em;text-align:right}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--grid);vertical-align:top}
th{color:var(--ink2);font-weight:600;white-space:nowrap}
th button{all:unset;cursor:pointer}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td a{color:var(--s1);text-decoration:none}
td a:hover{text-decoration:underline}
.pill{display:inline-block;border:1px solid var(--border);border-radius:999px;padding:0 7px;margin:0 4px 2px 0;font-size:11.5px;color:var(--ink2);white-space:nowrap}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:8px 0}
.pager{display:flex;gap:8px;align-items:center;color:var(--ink2)}
.scroll{overflow-x:auto}
#tip{position:fixed;z-index:10;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--border);box-shadow:0 4px 16px rgba(0,0,0,.18);border-radius:8px;padding:7px 10px;font-size:12.5px;max-width:280px;display:none}
#tip .r{display:flex;justify-content:space-between;gap:14px;color:var(--ink2)}
#tip b{color:var(--ink)}
.method{color:var(--ink2);font-size:12.5px}
.method h2{color:var(--ink)}
.method li{margin:3px 0}
.empty{padding:24px;text-align:center;color:var(--ink2)}
@media (max-width:760px){.grid{grid-template-columns:1fr}.tile.hero{grid-column:auto}}
</style>
</head>
<body>
<div class="page">
  <header>
    <div>
      <h1 id="title">Publication Tracker</h1>
      <div class="sub" id="subtitle">Loading…</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <span class="sub" id="updated"></span>
      <button class="btn" id="theme" aria-label="Switch between light and dark appearance">Light / dark</button>
    </div>
  </header>
  <div id="banner"></div>

  <div class="filters" role="group" aria-label="Filters">
    <div class="seg" role="tablist" aria-label="Scope" id="scope">
      <button role="tab" data-v="hpe" aria-selected="true">Health Professions Education</button>
      <button role="tab" data-v="all" aria-selected="false">All Health Sciences</button>
    </div>
    <label>From <select id="from"></select></label>
    <label>To <select id="to"></select></label>
    <label>Sub-theme <select id="theme-sel"></select></label>
    <label>Indexed in <select id="source"></select></label>
    <button class="btn" id="reset">Reset</button>
  </div>

  <div id="app"><div class="empty">Loading data…</div></div>
</div>
<div id="tip" role="tooltip"></div>

<script>
"use strict";
const AFRICA = new Set("DZ AO BJ BW BF BI CV CM CF TD KM CG CD CI DJ EG GQ ER SZ ET GA GM GH GN GW KE LS LR LY MG MW ML MR MU MA MZ NA NE NG RW ST SN SC SL SO ZA SS SD TZ TG TN UG ZM ZW".split(" "));
const COUNTRY = (() => { try { const d = new Intl.DisplayNames(["en"], {type:"region"}); return c => d.of(c) || c; } catch(e){ return c => c; } })();
const SRC_LABEL = {openalex:"OpenAlex", scopus:"Scopus", wos:"Web of Science"};
const STATUS_LABEL = {core_journal:"HPE journal", title_keyword:"Title keyword", manual_yes:"Confirmed manually"};
const state = {scope:"hpe", from:null, to:null, theme:"", source:"", page:0, sort:{k:"y",dir:-1}, q:"", tableView:{}};
let ALL = [], META = {}, YEAR_MIN = 0, YEAR_MAX = 0, CUR_YEAR = new Date().getFullYear();

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n == null ? "–" : n.toLocaleString("en-ZA").replace(/ /g," ");
const pct = (a,b) => b ? Math.round(a/b*100) + "%" : "–";

/* ---------- data ---------- */
async function load(){
  try{
    const [w,m] = await Promise.all([fetch("data/works.json").then(r=>{if(!r.ok)throw 0;return r.json()}),
                                     fetch("data/meta.json").then(r=>{if(!r.ok)throw 0;return r.json()})]);
    ALL = w; META = m;
  }catch(e){
    $("#app").innerHTML = '<div class="empty">No data yet. Run the <b>Update publications</b> workflow once (see README), then reload this page.</div>';
    return;
  }
  CUR_YEAR = new Date(META.generated_at).getFullYear();
  const ys = ALL.map(w=>w.y).filter(Boolean);
  YEAR_MIN = Math.min(...ys); YEAR_MAX = Math.max(...ys);
  state.from = YEAR_MIN; state.to = YEAR_MAX;
  $("#title").textContent = `${META.short_name} Publication Tracker`;
  $("#subtitle").textContent = `${META.institution} · ${META.lens} within the Faculty of Health Sciences · papers that name ${META.short_name} as an affiliation`;
  $("#updated").textContent = "Updated " + new Date(META.generated_at).toLocaleDateString("en-ZA",{day:"numeric",month:"short",year:"numeric"});
  if (META.demo_data) $("#banner").innerHTML = '<div class="banner"><b>Demo data.</b> These numbers are generated for testing and are not real publication counts.</div>';
  initFilters(); render();
}

function initFilters(){
  const yrs = []; for(let y=YEAR_MAX;y>=YEAR_MIN;y--) yrs.push(y);
  $("#from").innerHTML = [...yrs].reverse().map(y=>`<option ${y===state.from?"selected":""}>${y}</option>`).join("");
  $("#to").innerHTML = yrs.map(y=>`<option ${y===state.to?"selected":""}>${y}</option>`).join("");
  $("#theme-sel").innerHTML = '<option value="">All sub-themes</option>' + (META.themes||[]).map(t=>`<option>${esc(t)}</option>`).join("");
  const ext = META.external_sources_present || [];
  $("#source").innerHTML = '<option value="">Any index</option><option value="openalex">OpenAlex</option>' +
     ext.map(s=>`<option value="${s}">${SRC_LABEL[s]||s}</option>`).join("");
}

function rows(){
  return ALL.filter(w => w.y>=state.from && w.y<=state.to && (state.scope==="all" || w.h) &&
    (!state.theme || w.th.includes(state.theme)) && (!state.source || w.s.includes(state.source)));
}

/* ---------- stats ---------- */
function median(a){ if(!a.length) return null; a=[...a].sort((x,y)=>x-y); const m=a.length>>1; return a.length%2?a[m]:(a[m-1]+a[m])/2; }
function stats(r){
  const n=r.length;
  return {n, cit:r.reduce((a,w)=>a+w.c,0), fwci:median(r.map(w=>w.f).filter(x=>x!=null)),
    oa:r.filter(w=>w.o!=="closed").length,
    afr:r.filter(w=>w.cn.some(c=>c!=="ZA"&&AFRICA.has(c))).length,
    led:r.filter(w=>w.fa||w.la).length, hpe:r.filter(w=>w.h).length};
}
function countBy(r, keyFn){ const m=new Map(); r.forEach(w=>{ const ks=[].concat(keyFn(w)); ks.forEach(k=>{ if(k!==""&&k!=null) m.set(k,(m.get(k)||0)+1);});}); return [...m].sort((a,b)=>b[1]-a[1]); }

/* ---------- chart helpers ---------- */
function niceScale(max){
  const raw = max/4, p = Math.pow(10, Math.floor(Math.log10(raw||1)));
  const step = [1,2,5,10].map(k=>k*p).find(s=>s>=raw) || p*10;
  const top = Math.ceil(max/step)*step, ticks=[]; for(let t=0;t<=top+1e-9;t+=step) ticks.push(Math.round(t*100)/100);
  return {top:top||1, ticks};
}
function topRound(x,y,w,h,r){ r=Math.min(r,w/2,h); return `M${x},${y+h}L${x},${y+r}Q${x},${y} ${x+r},${y}L${x+w-r},${y}Q${x+w},${y} ${x+w},${y+r}L${x+w},${y+h}Z`; }
const REG = {};

function columns(id, years, series, opts={}){
  const W=720,H=250,m={l:40,r:opts.labels?78:12,t:10,b:26}, iw=W-m.l-m.r, ih=H-m.t-m.b;
  const totals = years.map((_,i)=>series.reduce((a,s)=>a+s.vals[i],0));
  const {top,ticks} = niceScale(Math.max(1,...totals));
  const slot = iw/years.length, bw = Math.min(24, slot*.62), y0 = m.t+ih;
  let g="";
  ticks.forEach(t=>{const y=y0-t/top*ih; g+=`<line class="grid" x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}"/><text class="tick" x="${m.l-6}" y="${y+3}" text-anchor="end">${t}</text>`;});
  g+=`<line class="axis" x1="${m.l}" x2="${W-m.r}" y1="${y0}" y2="${y0}"/>`;
  const every = Math.ceil(years.length/11);
  years.forEach((yr,i)=>{
    const cx=m.l+slot*i+slot/2; let acc=0;
    const lastIdx = series.reduce((a,s,k)=>s.vals[i]>0?k:a,-1);
    series.forEach((s,k)=>{
      const v=s.vals[i]; if(!v) return;
      const h=v/top*ih, y=y0-acc/top*ih-h, hh = acc>0?Math.max(h-2,1):h;
      const x=cx-bw/2;
      g += k===lastIdx ? `<path d="${topRound(x,y,bw,hh,4)}" fill="${s.color}"/>` : `<rect x="${x}" y="${y}" width="${bw}" height="${hh}" fill="${s.color}"/>`;
      if(opts.labels && i===years.length-1 && h>=13) g+=`<text class="dlabel" x="${cx+bw/2+6}" y="${y+hh/2+4}">${esc(s.short||s.name)}</text>`;
      acc+=v;
    });
    if(i%every===0 || i===years.length-1) g+=`<text class="tick" x="${cx}" y="${H-8}" text-anchor="middle">${yr}${yr===CUR_YEAR?"*":""}</text>`;
    g+=`<rect class="hit" data-i="${i}" x="${m.l+slot*i}" y="${m.t}" width="${slot}" height="${ih}"/>`;
  });
  REG[id]={kind:"cols", tip:i=>`<b>${years[i]}${years[i]===CUR_YEAR?" (year to date)":""}</b>` +
    series.map(s=>`<div class="r"><span><span class="sw" style="background:${s.color}"></span>${esc(s.name)}</span><b>${fmt(s.vals[i])}</b></div>`).join("") +
    (series.length>1?`<div class="r"><span>Total</span><b>${fmt(totals[i])}</b></div>`:"")};
  const legend = series.length>1 ? `<div class="legend">${series.map(s=>`<span><span class="sw" style="background:${s.color}"></span>${esc(s.name)}</span>`).join("")}</div>`:"";
  const table = mkTable(["Year",...series.map(s=>s.name)], years.map((yr,i)=>[yr,...series.map(s=>fmt(s.vals[i]))]), true);
  return {chart:`${legend}<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria||"Column chart")}" data-id="${id}">${g}</svg>`, table};
}

function lines(id, xs, series, opts={}){
  const W=opts.W||720,H=opts.H||230,m={l:44,r:opts.labels?84:14,t:12,b:26}, iw=W-m.l-m.r, ih=H-m.t-m.b, y0=m.t+ih;
  const all = series.flatMap(s=>s.vals.filter(v=>v!=null));
  const {top,ticks} = niceScale(opts.max ?? Math.max(1,...all));
  const X = i => m.l + (xs.length>1? i/(xs.length-1)*iw : iw/2), Y = v => y0 - v/top*ih;
  let g="";
  ticks.forEach(t=>{g+=`<line class="grid" x1="${m.l}" x2="${W-m.r}" y1="${Y(t)}" y2="${Y(t)}"/><text class="tick" x="${m.l-6}" y="${Y(t)+3}" text-anchor="end">${t}${opts.unit||""}</text>`;});
  g+=`<line class="axis" x1="${m.l}" x2="${W-m.r}" y1="${y0}" y2="${y0}"/>`;
  const every=Math.ceil(xs.length/10);
  xs.forEach((x,i)=>{ if(i%every===0||i===xs.length-1) g+=`<text class="tick" x="${X(i)}" y="${H-8}" text-anchor="middle">${esc(x)}</text>`; });
  series.forEach(s=>{
    const pts=s.vals.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);
    if(pts.length>1) g+=`<polyline fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p=>p.join(",")).join(" ")}"/>`;
    const last=pts[pts.length-1]; if(last){ g+=`<circle cx="${last[0]}" cy="${last[1]}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
      if(opts.labels) g+=`<text class="dlabel" x="${last[0]+9}" y="${last[1]+4}">${esc(s.short||s.name)}</text>`; }
  });
  g+=`<line class="xh" id="xh-${id}" y1="${m.t}" y2="${y0}" style="display:none"/>` + series.map((s,k)=>`<circle id="dot-${id}-${k}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2" style="display:none"/>`).join("");
  g+=`<rect class="hit" style="fill:transparent" data-line="1" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}"/>`;
  REG[id]={kind:"line",W,m,iw,n:xs.length,X,Y,series,
    tip:i=>`<b>${esc(xs[i])}</b>`+series.map(s=>`<div class="r"><span><span class="sw" style="background:${s.color}"></span>${esc(s.name)}</span><b>${s.vals[i]==null?"–":(opts.f?opts.f(s.vals[i]):fmt(s.vals[i]))}</b></div>`).join("")};
  const legend = series.length>1 ? `<div class="legend">${series.map(s=>`<span><span class="sw" style="background:${s.color}"></span>${esc(s.name)}</span>`).join("")}</div>`:"";
  const table = mkTable(["",...series.map(s=>s.name)], xs.map((x,i)=>[x,...series.map(s=>s.vals[i]==null?"–":(opts.f?opts.f(s.vals[i]):fmt(s.vals[i])))]), true);
  return {chart:`${legend}<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria||"Line chart")}" data-id="${id}">${g}</svg>`, table};
}

function ranked(items, opts={}){
  if(!items.length) return {chart:'<div class="empty">Nothing to show for these filters.</div>', table:""};
  const max=items[0][1], tot=opts.total;
  const html = `<div class="rank">${items.map(([k,v])=>`<div class="rrow" data-tip="${esc(`<b>${esc(opts.label?opts.label(k):k)}</b><div class='r'><span>${opts.unit||"Papers"}</span><b>${fmt(v)}</b></div>${tot?`<div class='r'><span>Share</span><b>${pct(v,tot)}</b></div>`:""}`)}">
    <span class="lab">${esc(opts.label?opts.label(k):k)}</span><span class="track"><div class="bar" style="width:${v/max*100}%"></div></span><span class="val">${fmt(v)}</span></div>`).join("")}</div>`;
  return {chart:html, table:mkTable([opts.head||"Name", opts.unit||"Papers"], items.map(([k,v])=>[opts.label?opts.label(k):k, fmt(v)]), false)};
}
function mkTable(head, body, numeric){
  return `<div class="scroll"><table><thead><tr>${head.map((h,i)=>`<th class="${numeric&&i?"num":""}">${esc(h)}</th>`).join("")}</tr></thead><tbody>${body.map(r=>`<tr>${r.map((c,i)=>`<td class="${numeric&&i?"num":""}">${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function card(id, title, desc, built, cls=""){
  const showT = state.tableView[id];
  return `<section class="card ${cls}" id="card-${id}"><div class="chead"><div><h2>${esc(title)}</h2><div class="desc">${desc}</div></div>
    <button class="btn tbl-toggle" data-toggle="${id}" aria-pressed="${!!showT}">${showT?"Chart":"Table"}</button></div>${showT?built.table:built.chart}</section>`;
}

/* ---------- render ---------- */
function render(){
  const r = rows(), st = stats(r), all = state.scope==="all";
  const hero = `<div class="tile hero"><div class="v">${fmt(st.n)}</div><div class="l">${all?"Health Sciences publications":"HPE publications"}</div><div class="n">${state.from}–${state.to}${state.to===CUR_YEAR?" (current year to date)":""}</div></div>`;
  const tiles = [
    all ? [pct(st.hpe,st.n), "are HPE", `${fmt(st.hpe)} papers`] : [fmt(st.cit), "Citations", "as counted by OpenAlex"],
    [st.fwci==null?"–":st.fwci.toFixed(2), "Median field-weighted citation impact", "1.0 = world average for the field"],
    [pct(st.oa,st.n), "Open access", `${fmt(st.oa)} papers`],
    [pct(st.afr,st.n), "With co-authors from other African countries", `${fmt(st.afr)} papers`],
    [pct(st.led,st.n), `${META.short_name} first or last author`, `${fmt(st.led)} papers`],
  ].map(([v,l,n])=>`<div class="tile"><div class="v">${v}</div><div class="l">${l}</div><div class="n">${n}</div></div>`).join("");

  const years=[]; for(let y=state.from;y<=state.to;y++) years.push(y);
  const byY = y => r.filter(w=>w.y===y);
  const seriesA = all
    ? [{name:"Health professions education",short:"HPE",color:"var(--s1)",vals:years.map(y=>byY(y).filter(w=>w.h).length)},
       {name:"Other health sciences",short:"Other",color:"var(--gray)",vals:years.map(y=>byY(y).filter(w=>!w.h).length)}]
    : [{name:"HPE publications",color:"var(--s1)",vals:years.map(y=>byY(y).length)}];
  const A = columns("perYear", years, seriesA, {labels:all, aria:"Publications per year"});

  const J = ranked(countBy(r,w=>w.j).slice(0,10), {total:st.n, head:"Journal"});
  const T = ranked(countBy(r.filter(w=>w.h),w=>w.th).slice(0,30), {total:st.hpe, head:"Theme"});
  const C = ranked(countBy(r,w=>w.cn.filter(c=>c!=="ZA")).slice(0,10), {label:COUNTRY, total:st.n, head:"Country", unit:"Papers with a co-author"});
  const MIN_N = 5;   // a share from a handful of papers is noise, so those years are left out
  const oaVals = years.map(y=>{const b=byY(y); return b.length>=MIN_N? Math.round(b.filter(w=>w.o!=="closed").length/b.length*100):null;});
  const O = lines("oa", years.map(String), [{name:"Open access share",color:"var(--s1)",vals:oaVals}], {W:460, H:250, max:100, unit:"%", f:v=>v+"%", aria:"Open access share by year"});

  let extra = "";
  const ext = META.external_sources_present||[];
  if(ext.length){
    const items = ["openalex",...ext].map(s=>[SRC_LABEL[s]||s, r.filter(w=>w.s.includes(s)).length]).sort((a,b)=>b[1]-a[1]);
    extra += card("cov","Which indexes list these papers","A paper counts if any index shows a "+esc(META.short_name)+" affiliation.", ranked(items,{total:st.n,head:"Index"}));
  }
  const hist = META.history||[];
  if(hist.length>1){
    const H = lines("hist", hist.map(h=>h.date), [
      {name:"All tracked",color:"var(--s2)",vals:hist.map(h=>+h.in_scope)},
      {name:"HPE",color:"var(--s1)",vals:hist.map(h=>+h.hpe)}], {labels:true, aria:"Tracked records per update"});
    extra += card("hist","Records tracked, by update","Growth here reflects both new papers and better database coverage.",H);
  }

  const q = state.q.trim().toLowerCase();
  let tr = q ? r.filter(w=>(w.t+" "+w.j+" "+w.d).toLowerCase().includes(q)) : r;
  const {k,dir}=state.sort;
  tr = [...tr].sort((a,b)=>{const x=a[k]??"",y=b[k]??""; return (x>y?1:x<y?-1:0)*dir || b.c-a.c;});
  const per=25, pages=Math.max(1,Math.ceil(tr.length/per)); state.page=Math.min(state.page,pages-1);
  const slice=tr.slice(state.page*per,(state.page+1)*per);
  const th=(key,label,num)=>`<th class="${num?"num":""}" aria-sort="${state.sort.k===key?(state.sort.dir>0?"ascending":"descending"):"none"}"><button data-sort="${key}">${label}${state.sort.k===key?(state.sort.dir>0?" ▲":" ▼"):""}</button></th>`;
  const tbl = `<div class="tools"><input type="search" id="q" placeholder="Search title, journal or DOI" value="${esc(state.q)}" aria-label="Search papers" style="min-width:240px">
    <div class="pager"><span>${fmt(tr.length)} papers</span><button class="btn" data-page="-1" ${state.page===0?"disabled":""}>Prev</button><span>${state.page+1} / ${pages}</span><button class="btn" data-page="1" ${state.page>=pages-1?"disabled":""}>Next</button><button class="btn" id="csv">Download CSV</button></div></div>
    <div class="scroll"><table><thead><tr>${th("y","Year",1)}${th("t","Title")}${th("j","Journal")}${th("c","Citations",1)}<th>Basis</th><th>Themes</th></tr></thead><tbody>
    ${slice.map(w=>`<tr><td class="num">${w.y}</td><td>${w.d?`<a href="https://doi.org/${esc(w.d)}" target="_blank" rel="noopener">${esc(w.t||w.d)}</a>`:esc(w.t)}</td><td>${esc(w.j)}</td><td class="num">${fmt(w.c)}</td>
      <td>${w.h?`<span class="pill">${STATUS_LABEL[w.hs]||w.hs}</span>`:""}</td><td>${w.th.map(t=>`<span class="pill">${esc(t)}</span>`).join("")}</td></tr>`).join("")||'<tr><td colspan="6" class="empty">No papers match.</td></tr>'}</tbody></table></div>`;

  const c = META.counts||{};
  $("#app").innerHTML = `<div class="kpis">${hero}${tiles}</div><div class="grid">
    ${card("perYear", all?"Publications per year":"HPE publications per year", all?"Health professions education shown against the rest of the Faculty."+(state.to===CUR_YEAR?" * Year to date.":""):(state.to===CUR_YEAR?"* Year to date.":"Papers with a "+esc(META.short_name)+" affiliation."), A, "wide")}
    ${card("journals","Where these papers are published","Top 10 journals for the current selection.",J)}
    ${card("themes","Sub-themes within HPE","Papers can carry more than one theme. Themes are assigned from title and abstract wording.",T)}
    ${card("countries","Collaboration: co-author countries","Countries other than South Africa, by number of papers with a co-author there.",C)}
    ${card("oa","Open access share by year","Share of papers that are open access in any form. Years with fewer than 5 papers are left out.",O)}
    ${extra}
    <section class="card wide"><div class="chead"><div><h2>Papers</h2><div class="desc">Every paper behind the charts above. Select a title to open it by DOI.</div></div></div>${tbl}</section>
    <section class="card wide method"><h2>How papers are counted</h2><ul>
      <li><b>Institution:</b> a paper counts only if an index lists ${esc(META.institution)} as an affiliation (OpenAlex institution match or affiliation text; Scopus and Web of Science via exports). Hospital-only affiliations do not count.</li>
      <li><b>Health Sciences:</b> an author's affiliation names a Faculty of Health Sciences unit, or OpenAlex classes the paper under Health Sciences.</li>
      <li><b>HPE:</b> published in a health professions education journal, or with an HPE term in the title, or confirmed by hand. ${fmt(c.review_candidates||0)} further papers are awaiting review and are not counted.</li>
      <li><b>Excluded:</b> retracted papers (${fmt(c.retracted_excluded||0)}). Citation counts and impact come from OpenAlex and may differ from Scopus or Web of Science.</li>
    </ul></section></div>`;
  bindAll();
}

/* ---------- interaction ---------- */
const tip = $("#tip");
function showTip(html, ev){
  tip.innerHTML = html; tip.style.display="block";
  const pad=14, w=tip.offsetWidth, h=tip.offsetHeight;
  let x=ev.clientX+pad, y=ev.clientY+pad;
  if(x+w>innerWidth-8) x=ev.clientX-w-pad; if(y+h>innerHeight-8) y=ev.clientY-h-pad;
  tip.style.left=Math.max(8,x)+"px"; tip.style.top=Math.max(8,y)+"px";
}
const hideTip = () => { tip.style.display="none"; };

function bindAll(){
  document.querySelectorAll("svg.chart").forEach(svg=>{
    const id=svg.dataset.id, reg=REG[id]; if(!reg) return;
    if(reg.kind==="cols"){
      svg.addEventListener("mousemove",e=>{const t=e.target.closest(".hit"); if(t) showTip(reg.tip(+t.dataset.i),e); else hideTip();});
    } else {
      const xh=svg.querySelector("#xh-"+id);
      svg.addEventListener("mousemove",e=>{
        const box=svg.getBoundingClientRect(), x=(e.clientX-box.left)/box.width*reg.W;
        let i=Math.round((x-reg.m.l)/reg.iw*(reg.n-1)); i=Math.max(0,Math.min(reg.n-1,i));
        xh.setAttribute("x1",reg.X(i)); xh.setAttribute("x2",reg.X(i)); xh.style.display="";
        reg.series.forEach((s,k)=>{const d=svg.querySelector(`#dot-${id}-${k}`); if(s.vals[i]==null){d.style.display="none";return;} d.setAttribute("cx",reg.X(i)); d.setAttribute("cy",reg.Y(s.vals[i])); d.style.display="";});
        showTip(reg.tip(i),e);
      });
      svg.addEventListener("mouseleave",()=>{xh.style.display="none"; svg.querySelectorAll("circle[id^=dot]").forEach(d=>d.style.display="none"); hideTip();});
    }
    svg.addEventListener("mouseleave",hideTip);
  });
  document.querySelectorAll("[data-tip]").forEach(n=>{
    n.addEventListener("mousemove",e=>showTip(n.dataset.tip,e)); n.addEventListener("mouseleave",hideTip);
  });
  document.querySelectorAll("[data-toggle]").forEach(b=>b.addEventListener("click",()=>{const id=b.dataset.toggle; state.tableView[id]=!state.tableView[id]; render();}));
  document.querySelectorAll("[data-sort]").forEach(b=>b.addEventListener("click",()=>{const k=b.dataset.sort; state.sort = state.sort.k===k?{k,dir:-state.sort.dir}:{k,dir:k==="t"||k==="j"?1:-1}; render();}));
  document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>{state.page+=+b.dataset.page; render();}));
  const q=$("#q"); if(q) q.addEventListener("input",()=>{state.q=q.value; state.page=0; const pos=q.selectionStart; render(); const n=$("#q"); n.focus(); n.setSelectionRange(pos,pos);});
  const csv=$("#csv"); if(csv) csv.addEventListener("click",downloadCsv);
}

function downloadCsv(){
  const r=rows(), cols=["doi","title","year","journal","type","citations","open_access","hpe_basis","themes","indexed_in"];
  const cell=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const lines=[cols.join(",")].concat(r.map(w=>[w.d,w.t,w.y,w.j,w.ty,w.c,w.o,w.hs,w.th.join("; "),w.s.join("; ")].map(cell).join(",")));
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob(["﻿"+lines.join("\n")],{type:"text/csv"})); a.download=`${META.short_name}-publications.csv`; a.click(); URL.revokeObjectURL(a.href);
}

$("#scope").addEventListener("click",e=>{const b=e.target.closest("button"); if(!b) return; state.scope=b.dataset.v; state.page=0;
  document.querySelectorAll("#scope button").forEach(x=>x.setAttribute("aria-selected",x===b)); render();});
$("#from").addEventListener("change",e=>{state.from=+e.target.value; if(state.from>state.to){state.to=state.from; $("#to").value=state.to;} state.page=0; render();});
$("#to").addEventListener("change",e=>{state.to=+e.target.value; if(state.to<state.from){state.from=state.to; $("#from").value=state.from;} state.page=0; render();});
$("#theme-sel").addEventListener("change",e=>{state.theme=e.target.value; state.page=0; render();});
$("#source").addEventListener("change",e=>{state.source=e.target.value; state.page=0; render();});
$("#reset").addEventListener("click",()=>{Object.assign(state,{scope:"hpe",from:YEAR_MIN,to:YEAR_MAX,theme:"",source:"",page:0,q:""});
  document.querySelectorAll("#scope button").forEach(x=>x.setAttribute("aria-selected",x.dataset.v==="hpe")); initFilters(); render();});
$("#theme").addEventListener("click",()=>{
  const cur=document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
  const next=cur==="dark"?"light":"dark"; document.documentElement.dataset.theme=next; try{localStorage.setItem("pt-theme",next);}catch(e){}});
try{const t=localStorage.getItem("pt-theme"); if(t) document.documentElement.dataset.theme=t;}catch(e){}
document.addEventListener("scroll",hideTip,true);
load();
</script>
