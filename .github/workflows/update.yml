name: Update publications

on:
  schedule:
    - cron: "17 3 * * 1"      # every Monday, 03:17 UTC (05:17 in Cape Town)
  workflow_dispatch:           # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-publications
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Offline self-test
        env:
          OPENALEX_API_KEY: dummy-for-offline-test
        run: python -m tests.test_pipeline

      - name: Harvest, tag and build data files
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python -m tracker.run

      - name: Commit updated data
        run: |
          git config user.name  "publication-tracker[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data data/history.csv data/review_queue.csv data/unresolved_external.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update publication data $(date -u +%F)"
            git push
          fi
